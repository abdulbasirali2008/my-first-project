<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOPPING</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            background-color: #f4f4f4;
        }

        /* হেডার ও নেভিগেশন */
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff9900;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            display: flex;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-bar button {
            background-color: #ff9900;
            border: none;
            padding: 8px 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-status {
            font-weight: bold;
            background: #37475a;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* Liquid Wave / Glow Effect */
        .liquid-text {
            background: linear-gradient(270deg, #ff007f, #00d2ff, #00ff88, #ff007f);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: liquidGlow 6s ease infinite;
        }

        .liquid-badge {
            border: 2px solid transparent;
            background-image: linear-gradient(#37475a, #37475a), linear-gradient(90deg, #00d2ff, #ff007f);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        @keyframes liquidGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* অফার ব্যানার */
        .banner {
            background: linear-gradient(90deg, #ff9900, #ff5500);
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        /* প্রোডাক্ট গ্রিড */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* প্রোডাক্ট কার্ড */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
        }

        .price {
            color: #B12704;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #ffd814;
            border: 1px solid #FCD200;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .add-btn:hover {
            background-color: #f7ca00;
        }

        /* 📱 Floating Pill Bottom Navigation Bar (আপনার ছবির ডিজাইনে) */
        .bottom-nav-container {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            z-index: 999;
        }

        .bottom-nav {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            flex: 1;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 3px;
        }

        /* Active/Selected Item Highlight */
        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #3b82f6;
        }

        .nav-item.active svg {
            fill: #3b82f6;
        }

        /* Cart Counter Badge inside Nav */
        .cart-badge {
            position: absolute;
            top: 4px;
            right: 18px;
            background: #ff3b30;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* অ্যাকাউন্ট লগইন মোডাল */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-box h3 {
            margin-top: 0;
            color: #232f3e;
        }

        .modal-box input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .login-submit-btn {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 10px;
            width: 95%;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MY SHOPPING</div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>

        <div class="header-right">
            <div class="user-status" id="header-user" onclick="openAccountModal()">
                👤 Login
            </div>
        </div>
    </header>

    <div class="banner">
        🔥 Big Sale! Get 20% OFF on all items today!
    </div>

    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-grid">
            
            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <div class="price">৳ 1,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphone">
                <h3>Wireless Headphone</h3>
                <div class="price">৳ 2,200</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="USB Keyboard">
                <h3>USB Keyboard</h3>
                <div class="price">৳ 850</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sneakers">
                <h3>Running Shoes</h3>
                <div class="price">৳ 3,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

        </div>
    </div>

    <!-- অ্যাকাউন্ট লগইন মোডাল (Pop-up) -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeAccountModal()">&times;</span>
            <h3 id="modal-title">Account Login</h3>
            
            <div id="login-form">
                <input type="text" id="username-input" placeholder="Enter your name">
                <input type="tel" id="userphone-input" placeholder="Enter Mobile Number (017XXXXXXXX)">
                <input type="password" placeholder="Password">
                <button class="login-submit-btn" onclick="handleLogin()">Login</button>
            </div>

            <div id="user-profile" style="display: none;">
                <p style="font-size: 18px;">Welcome, <b id="display-name" class="liquid-text">User</b>!</p>
                <p style="font-size: 14px; color: #555;">Phone: <span id="display-phone"></span></p>
                <button class="login-submit-btn" style="background:#d9534f;" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- 📱 Floating Pill Bottom Navigation Bar -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <!-- Home -->
            <div class="nav-item active" id="nav-home" onclick="setActiveNav('nav-home'); window.scrollTo(0, 0);">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            
            <!-- Categories -->
            <div class="nav-item" id="nav-cat" onclick="setActiveNav('nav-cat'); alert('Categories coming soon!');">
                <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                <span>Categories</span>
            </div>

            <!-- Cart (ওপর থেকে নিচে আনা হয়েছে) -->
            <div class="nav-item" id="nav-cart" onclick="setActiveNav('nav-cart'); alert('Cart item list coming soon!');">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="cart-badge" id="cart-count">0</span>
                <span>Cart</span>
            </div>

            <!-- Account -->
            <div class="nav-item" id="nav-account" onclick="setActiveNav('nav-account'); openAccountModal();">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="nav-account-text">Account</span>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        let currentUser = null;

        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert("Item added to cart!");
        }

        /* Tab Switch Effect */
        function setActiveNav(elementId) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(elementId).classList.add('active');
        }

        /* অ্যাকাউন্ট মোডাল কন্ট্রোল */
        function openAccountModal() {
            document.getElementById('accountModal').style.display = 'flex';
        }

        function closeAccountModal() {
            document.getElementById('accountModal').style.display = 'none';
        }

        /* লগইন লজিক */
        function handleLogin() {
            const nameInput = document.getElementById('username-input').value;
            const phoneInput = document.getElementById('userphone-input').value;

            if (nameInput.trim() === "") {
                alert("Please enter a valid name!");
                return;
            }

            if (phoneInput.trim() === "") {
                alert("Please enter your mobile number!");
                return;
            }

            currentUser = nameInput;
            
            // ইউজারের নাম Liquid Glow ইফেক্ট সহ আপডেট
            const headerUser = document.getElementById('header-user');
            headerUser.innerHTML = `👤 <span class="liquid-text">${currentUser}</span>`;
            headerUser.classList.add('liquid-badge');

            const navAccount = document.getElementById('nav-account-text');
            navAccount.innerHTML = `<span class="liquid-text">${currentUser}</span>`;

            document.getElementById('display-name').innerText = currentUser;
            document.getElementById('display-phone').innerText = phoneInput;

            document.getElementById('login-form').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('modal-title').innerText = "My Profile";

            alert("Logged in successfully!");
            closeAccountModal();
        }

        /* লগআউট লজিক */
        function handleLogout() {
            currentUser = null;

            const headerUser = document.getElementById('header-user');
            headerUser.innerHTML = "👤 Login";
            headerUser.classList.remove('liquid-badge');

            document.getElementById('nav-account-text').innerText = "Account";

            document.getElementById('login-form').style.display = 'block';
            document.getElementById('user-profile').style.display = 'none';
            document.getElementById('modal-title').innerText = "Account Login";
            document.getElementById('username-input').value = "";
            document.getElementById('userphone-input').value = "";

            alert("Logged out!");
            closeAccountModal();
        }
    </script>

</body>
</html>
