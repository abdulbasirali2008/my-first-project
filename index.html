<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPPING BAZAR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            background-color: #f4f4f4;
        }

        /* হেডার */
        header {
            background-color: #232f3e;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* লোগোর আকার নিয়ন্ত্রণ */
        header .logo-container {
            width: 200px;
            height: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* কাস্টম পিল-স্টাইল সার্চ বার */
        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 42px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .search-bar input:focus {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-status {
            font-weight: bold;
            background: #37475a;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* Liquid Wave Effect for Logged-in Name */
        .liquid-text {
            background: linear-gradient(270deg, #ff007f, #00d2ff, #00ff88, #ff007f);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: liquidGlow 6s ease infinite;
        }

        .liquid-badge {
            border: 2px solid transparent;
            background-image: linear-gradient(#37475a, #37475a), linear-gradient(90deg, #00d2ff, #ff007f);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        @keyframes liquidGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .banner {
            background: linear-gradient(90deg, #ff9900, #ff5500);
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
        }

        .price {
            color: #B12704;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #ffd814;
            border: 1px solid #FCD200;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* Floating Pill Bottom Navigation Bar */
        .bottom-nav-container {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            z-index: 999;
        }

        .bottom-nav {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a0a0a0;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            flex: 1;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 3px;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #3b82f6;
        }

        .nav-item.active svg {
            fill: #3b82f6;
        }

        .cart-badge {
            position: absolute;
            top: 4px;
            right: 18px;
            background: #ff3b30;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }

        .auth-tab.active {
            color: #ff9900;
            border-bottom: 3px solid #ff9900;
        }

        .modal-box input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .login-submit-btn {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 10px;
            width: 95%;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <!-- SHOPPING BAZAR Logo -->
        <div class="logo-container" onclick="window.scrollTo(0, 0);">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FF9900" />
                  <stop offset="100%" stop-color="#FF5500" />
                </linearGradient>
              </defs>
              <g transform="translate(10, 10)">
                <path d="M 25 30 A 12 12 0 0 1 49 30" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
                <path d="M 12 28 L 62 28 L 56 75 C 56 78 53 80 50 80 L 24 80 C 21 80 18 78 18 75 Z" fill="url(#bagGrad)" filter="url(#glow)"/>
                <path d="M 28 52 L 35 60 L 48 45" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <text x="90" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#FF9900" letter-spacing="1">
                SHOPPING
              </text>
              <text x="275" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#00D2FF" filter="url(#glow)" letter-spacing="1">
                BAZAR
              </text>
              <text x="92" y="75" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#A0A0A0" letter-spacing="3">
                YOUR TRUSTED ONLINE SHOP
              </text>
            </svg>
        </div>

        <!-- New Pill Style Search Bar -->
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" placeholder="Search">
        </div>

        <div class="header-right">
            <div class="user-status" id="header-user" onclick="openAccountModal()">
                👤 Login
            </div>
        </div>
    </header>

    <div class="banner">
        🔥 Big Sale! Get 20% OFF on all items today!
    </div>

    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <div class="price">৳ 1,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphone">
                <h3>Wireless Headphone</h3>
                <div class="price">৳ 2,200</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="USB Keyboard">
                <h3>USB Keyboard</h3>
                <div class="price">৳ 850</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sneakers">
                <h3>Running Shoes</h3>
                <div class="price">৳ 3,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeAccountModal()">&times;</span>
            
            <div class="auth-tabs" id="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</div>
            </div>

            <div id="login-form">
                <input type="tel" id="login-phone" placeholder="Enter Mobile Number">
                <input type="password" id="login-pass" placeholder="Password">
                <button class="login-submit-btn" onclick="handleLogin()">Login</button>
            </div>

            <div id="signup-form" style="display: none;">
                <input type="text" id="signup-name" placeholder="Full Name">
                <input type="tel" id="signup-phone" placeholder="Mobile Number">
                <input type="password" id="signup-pass" placeholder="Create Password">
                <button class="login-submit-btn" style="background:#28a745;" onclick="handleSignUp()">Sign Up</button>
            </div>

            <div id="user-profile" style="display: none;">
                <p style="font-size: 18px;">Welcome, <b id="display-name" class="liquid-text">User</b>!</p>
                <p style="font-size: 14px; color: #555;">Phone: <span id="display-phone"></span></p>
                <button class="login-submit-btn" style="background:#d9534f;" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- Floating Bottom Navigation Bar -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="setActiveNav('nav-home'); window.scrollTo(0, 0);">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" id="nav-cat" onclick="setActiveNav('nav-cat'); alert('Categories coming soon!');">
                <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                <span>Categories</span>
            </div>
            <div class="nav-item" id="nav-cart" onclick="setActiveNav('nav-cart'); alert('Cart item list coming soon!');">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="cart-badge" id="cart-count">0</span>
                <span>Cart</span>
            </div>
            <div class="nav-item" id="nav-account" onclick="setActiveNav('nav-account'); openAccountModal();">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="nav-account-text">Account</span>
            </div>
        </div>
    </div>

    <script>
        let count = 0;

        window.onload = function() {
            checkAutoLogin();
        };

        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert("Item added to cart!");
        }

        function setActiveNav(elementId) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(elementId).classList.add('active');
        }

        function openAccountModal() {
            document.getElementById('accountModal').style.display = 'flex';
        }

        function closeAccountModal() {
            document.getElementById('accountModal').style.display = 'none';
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
            } else {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('signup-form').style.display = 'block';
                document.getElementById('login-form').style.display = 'none';
            }
        }

        function handleSignUp() {
            const name = document.getElementById('signup-name').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const pass = document.getElementById('signup-pass').value.trim();

            if (!name || !phone || !pass) {
                alert("Please fill in all fields!");
                return;
            }

            const userData = { name: name, phone: phone, pass: pass };
            localStorage.setItem("user_" + phone, JSON.stringify(userData));

            alert("Account created successfully! Now please login.");
            switchAuthTab('login');
            document.getElementById('login-phone').value = phone;
        }

        function handleLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            const savedUser = localStorage.getItem("user_" + phone);

            if (!savedUser) {
                alert("No account found with this phone number! Please Sign Up first.");
                return;
            }

            const parsedUser = JSON.parse(savedUser);

            if (parsedUser.pass === pass) {
                localStorage.setItem("session_user", JSON.stringify(parsedUser));
                applyLoggedInUI(parsedUser.name, parsedUser.phone);
                alert("Logged in successfully!");
                closeAccountModal();
            } else {
                alert("Incorrect Password!");
            }
        }

        function checkAutoLogin() {
            const activeSession = localStorage.getItem("session_user");
            if (activeSession) {
                const user = JSON.parse(activeSession);
                applyLoggedInUI(user.name, user.phone);
            }
        }

        function applyLoggedInUI(name, phone) {
            const headerUser = document.getElementById('header-user');
            headerUser.innerHTML = `👤 <span class="liquid-text">${name}</span>`;
            headerUser.classList.add('liquid-badge');

            const navAccount = document.getElementById('nav-account-text');
            navAccount.innerHTML = `<span class="liquid-text">${name}</span>`;

            document.getElementById('display-name').innerText = name;
            document.getElementById('display-phone').innerText = phone;

            document.getElementById('auth-tabs').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
        }

        function handleLogout() {
            localStorage.removeItem("session_user");
            
            const headerUser = document.getElementById('header-user');
            headerUser.innerHTML = "👤 Login";
            headerUser.classList.remove('liquid-badge');

            document.getElementById('nav-account-text').innerText = "Account";

            document.getElementById('auth-tabs').style.display = 'flex';
            document.getElementById('user-profile').style.display = 'none';
            switchAuthTab('login');

            alert("Logged out successfully!");
            closeAccountModal();
        }
    </script>

</body>
</html>
