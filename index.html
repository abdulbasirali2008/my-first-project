<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }

        /* Header and Navigation Bar */
        header {
            background-color: #24292e;
            color: white;
            padding: 20px 0;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Main Content */
        .container {
            padding: 50px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
        </nav>
    </header>

    <div class="container">
        <h2>Hello, I'm Abdul Basir!</h2>
        <p>I am learning web development. This is my first website hosted on GitHub.</p>
        <br>
        <button class="btn" onclick="showMessage()">Click for Magic</button>
    </div>

    <script>
        function showMessage() {
            alert('Thank you for visiting my website!');
        }
    </script>

</body>
</html>
