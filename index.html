<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* হেডার ও নেভিগেশন */
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff9900;
        }

        /* প্রোডাক্ট গ্রিড */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* প্রোডাক্ট কার্ড */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
        }

        .price {
            color: #B12704;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #ffd814;
            border: 1px solid #FCD200;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .add-btn:hover {
            background-color: #f7ca00;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">My Shop</div>
        <div>Cart (0)</div>
    </header>

    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-grid">
            
            <!-- প্রোডাক্ট ১ -->
            <div class="card">
                <img src="https://via.placeholder.com/150" alt="Product">
                <h3>Smart Watch</h3>
                <div class="price">৳ 1,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- প্রোডাক্ট ২ -->
            <div class="card">
                <img src="https://via.placeholder.com/150" alt="Product">
                <h3>Wireless Headphone</h3>
                <div class="price">৳ 2,200</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- প্রোডাক্ট ৩ -->
            <div class="card">
                <img src="https://via.placeholder.com/150" alt="Product">
                <h3>USB Keyboard</h3>
                <div class="price">৳ 850</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

        </div>
    </div>

    <script>
        function addToCart() {
            alert("Item added to cart successfully!");
        }
    </script>

</body>
</html>
