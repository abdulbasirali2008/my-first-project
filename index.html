<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* হেডার ও নেভিগেশন */
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff9900;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            display: flex;
        }

        .search-bar input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-bar button {
            background-color: #ff9900;
            border: none;
            padding: 8px 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-box {
            font-weight: bold;
            background: #37475a;
            padding: 8px 15px;
            border-radius: 20px;
        }

        /* অফার ব্যানার */
        .banner {
            background: linear-gradient(90deg, #ff9900, #ff5500);
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        /* প্রোডাক্ট গ্রিড */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* প্রোডাক্ট কার্ড */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
        }

        .price {
            color: #B12704;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #ffd814;
            border: 1px solid #FCD200;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .add-btn:hover {
            background-color: #f7ca00;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">My Shop</div>
        
        <!-- সার্চ বার -->
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>

        <!-- কার্ট কাউন্টার -->
        <div class="cart-box">
            🛒 Cart (<span id="cart-count">0</span>)
        </div>
    </header>

    <!-- প্রমো ব্যানার -->
    <div class="banner">
        🔥 Big Sale! Get 20% OFF on all items today!
    </div>

    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-grid">
            
            <!-- প্রোডাক্ট ১ -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <div class="price">৳ 1,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- প্রোডাক্ট ২ -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphone">
                <h3>Wireless Headphone</h3>
                <div class="price">৳ 2,200</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- প্রোডাক্ট ৩ -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="USB Keyboard">
                <h3>USB Keyboard</h3>
                <div class="price">৳ 850</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- প্রোডাক্ট ৪ -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sneakers">
                <h3>Running Shoes</h3>
                <div class="price">৳ 3,500</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
            </div>

        </div>
    </div>

    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert("Item added to cart!");
        }
    </script>

</body>
</html>
