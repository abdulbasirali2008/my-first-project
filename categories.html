
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPPING BAZAR - Categories</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            background-color: #f4f4f4;
        }

        header {
            background-color: #232f3e;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header .logo-container {
            width: 140px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .header-title {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 15px auto;
            padding: 0 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            margin-bottom: 15px;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .cat-box {
            background: #fff;
            padding: 20px 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 1px solid #eee;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cat-box svg {
            width: 36px;
            height: 36px;
            fill: #ff5722;
            margin-bottom: 8px;
        }

        .cat-box span {
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        .bottom-nav-container {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            z-index: 999;
        }

        .bottom-nav {
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a0a0a0;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 20px;
            transition: all 0.3s ease;
            position: relative;
            flex: 1;
            text-decoration: none;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #3b82f6;
        }

        .nav-item.active svg {
            fill: #3b82f6;
        }

        .cart-badge {
            position: absolute;
            top: 3px;
            right: 12px;
            background: #ff3b30;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html';">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FF9900" />
                  <stop offset="100%" stop-color="#FF5500" />
                </linearGradient>
              </defs>
              <g transform="translate(10, 10)">
                <path d="M 25 30 A 12 12 0 0 1 49 30" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
                <path d="M 12 28 L 62 28 L 56 75 C 56 78 53 80 50 80 L 24 80 C 21 80 18 78 18 75 Z" fill="url(#bagGrad)" filter="url(#glow)"/>
                <path d="M 28 52 L 35 60 L 48 45" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <text x="90" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#FF9900" letter-spacing="1">SHOPPING</text>
              <text x="275" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#00D2FF" filter="url(#glow)" letter-spacing="1">BAZAR</text>
            </svg>
        </div>
        <div class="header-title">Categories</div>
    </header>

        <div class="section-title">All Categories</div>
        <div class="cat-grid">

                <span>Men's</span>
            </a>
            <a class="cat-box" href="index.html">
                <svg viewBox="0 0 24 24"><path d="M18 2h-8C6.13 2 3 5.13 3 9v6c0 3.87 3.13 7 7 7h8c3.87 0 7-3.13 7-7V9c0-3.87-3.13-7-7-7zm-8 18c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                <span>Appliances</span>
            </a>
            <a class="cat-box" href="index.html">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <span>Sports</span>
            </a>
        </div>
    </div>

    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <a class="nav-item" href="index.html">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

                <span>Account</span>
            </div>
        </div>
    </div>

</body>
</html>
